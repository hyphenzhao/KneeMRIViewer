# 本平台在 23 例标注数据上与 Framingham 的实测偏差，用于解释图上的偏移。
# 不是「校正系数」——记录在此是为了让读图的人知道哪些差异是已知的。
observed_deviation_note_zh: >-
  在本院 23 例标注数据上，胫骨各亚区与 Framingham 吻合较好（cMT −0%、iLT −4%、
  pMT −6%、cLT/aLT −8%、aMT −9%）；股骨髁中央带系统性偏薄 18-23%，方向与上述
  层厚导致的低估一致；而 eMT（+31%）、eLT（+16%）偏厚，原因尚未确定，
  可能与亚区边界定义有关，待医生复核后细化。

# 厚度推导的 MRI 改良 Outerbridge 分级参数。
# 由 Python 计算，LLM 只能引用；改这里的阈值会产生新的形态学计算记录（旧记录不覆盖）。
# ⚠ 样例报告里没有任何正式分级，本分级是新增的一层，未经关节镜验证，须医生复核。
outerbridge:
  scale_zh: MRI 改良 Outerbridge（厚度推导）
  deficit_ii: 0.25            # 局灶厚度缺失 ≥25% 且 <50% → II 级
  deficit_iii: 0.50           # ≥50% → III 级
  min_lesion_area_mm2: 30     # 小于此面积的斑块不计为病灶
  min_lesion_slices: 2        # 只跨一个原始层的斑块无法与部分容积伪影区分，不报
  edge_margin_mm: 3.0         # 软骨板边缘自然变薄，距边缘此范围内不参与局灶分级
  min_enclosure: 0.8          # 裸露斑块四周被软骨包围的比例达到此值才算 IV 级（否则多为分割边界）
  local_baseline_radius_mm: 10 # 「局灶」的基线：周围此半径内软骨的面积加权平均厚度
  closing_radius_mm: 4.0      # 覆盖区测地闭运算半径（判定 IV 级裸露骨面）
  min_denuded_area_mm2: 20    # 小于此面积的裸露斑块不计
  min_baseline_mm: 0.8        # 软骨板基线中位数低于此值不评估
  grading_note_zh: >-
    分级由软骨厚度相对其周围约 10 mm 范围内软骨平均厚度的局部缺失推导：II 级为缺失小于 50%，
    III 级为缺失大于等于 50%，IV 级为被软骨包围的裸露骨面；I 级需信号信息，本方法不评估。
    基线取本例自身，弥漫性变薄时分级可能偏低；软骨板边缘 3 mm 内不参与分级。
    层厚 3 mm，内外侧方向小于 3 mm 的病灶无法分辨，仅跨一层的斑块不报。
